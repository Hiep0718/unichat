<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="UniChat — nền tảng tri thức AI cho tài liệu học tập"
    />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0..1,0&family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@24,400..500,0..1,0&display=swap" rel="stylesheet" />
    <title>UniChat — Nền tảng Tri thức AI RAG Workspace</title>
    <script>
      // Polyfill for sockjs-client which expects Node's 'global' object
      if (typeof global === 'undefined') {
        window.global = window;
      }
    </script>
    <script>
      // Áp chế độ hiển thị trước khi trang vẽ lần đầu.
      //
      // Nếu để React làm việc này thì người dùng nền tối thấy một chớp trắng
      // ở mỗi lần tải, vì bundle chỉ chạy sau khi trình duyệt đã vẽ xong
      // khung đầu tiên. Đoạn này cố ý nằm inline và đồng bộ.
      //
      // Logic phải khớp với src/lib/theme.ts; chỉ có tên khóa là chia sẻ.
      (function () {
        try {
          var saved = localStorage.getItem('unichat.theme');
          if (saved === 'light' || saved === 'dark') {
            document.documentElement.setAttribute('data-theme', saved);
          }
        } catch (err) {
          // Lưu trữ bị chặn: đi theo thiết lập hệ thống, không chặn tải trang.
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
