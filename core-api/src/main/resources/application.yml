spring:
  application:
    name: unichat-core-api
  servlet:
    multipart:
      enabled: true
      max-file-size: 20MB
      max-request-size: 25MB
  datasource:

    url: ${POSTGRES_URL}
    username: ${POSTGRES_USER}
    password: ${POSTGRES_PASSWORD}
  flyway:
    enabled: true
    validate-on-migrate: false
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  security:
    oauth2:
      resourceserver:
        jwt:
          public-key-location: ${JWT_PUBLIC_KEY_LOCATION}
  rabbitmq:
    addresses: ${RABBITMQ_URL:amqp://guest:guest@localhost:5672}
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
  mail:
    host: ${MAIL_HOST:smtp.gmail.com}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

server:
  port: ${CORE_API_PORT:8082}
  shutdown: graceful

management:
  endpoints:
    web:
      exposure:
        include: health,prometheus
  endpoint:
    health:
      probes:
        enabled: true

logging:
  level:
    root: ${LOG_LEVEL:INFO}

unichat:
  jwt:
    access-token-ttl-seconds: 900
  refresh-token:
    ttl-days: 7
  ai-service:
    url: ${AI_SERVICE_BASE_URL:http://localhost:8001}
  storage:
    provider: ${STORAGE_PROVIDER:local}
    dir: ${FILE_STORAGE_ROOT:./data/storage}
    supabase:
      url: ${SUPABASE_STORAGE_URL:}
      key: ${SUPABASE_SERVICE_KEY:}
      bucket: ${SUPABASE_STORAGE_BUCKET:documents}
