# UniChat web gateway: serves the SPA and proxies /api and /ws to the private Core API.
# Included inside nginx's http{} block (conf.d), so `map` is allowed here.

# Preserve the original scheme when TLS terminates upstream (ALB/CloudFront);
# otherwise use the scheme of this listener.
map $http_x_forwarded_proto $unichat_forwarded_proto {
    default $http_x_forwarded_proto;
    ""      $scheme;
}

map $http_host $unichat_host {
    default $http_host;
    ""      $host;
}

map $http_upgrade $unichat_connection_upgrade {
    default upgrade;
    ""      close;
}

server {
    listen 80;
    server_name _;
    server_tokens off;
    root /usr/share/nginx/html;
    index index.html;

    # Core API accepts 25 MB multipart requests; leave headroom for encoding.
    client_max_body_size 30M;

    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/javascript application/javascript application/json
               application/xml image/svg+xml;

    # nginx drops server-level add_header when a location defines its own,
    # so every location that adds headers repeats the security set.
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # Vite emits content-hashed file names, so assets can be cached forever.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        try_files $uri =404;
    }

    location = /index.html {
        add_header Cache-Control "no-store" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    }

    location /api/ {
        proxy_pass http://core-api:8082;
        proxy_http_version 1.1;
        proxy_set_header Host $unichat_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $unichat_forwarded_proto;
        proxy_set_header Connection "";
        proxy_connect_timeout 30s;
        proxy_send_timeout 300s;
        proxy_read_timeout 300s;
        # Unbuffered so AI answers stream token by token (SSE).
        proxy_buffering off;
        proxy_cache off;
    }

    # Work Chat STOMP over WebSocket.
    location /ws/ {
        proxy_pass http://core-api:8082;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $unichat_connection_upgrade;
        proxy_set_header Host $unichat_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $unichat_forwarded_proto;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # Actuator and private routes are never reachable from the internet.
    location /actuator/ { return 404; }
    location /internal/ { return 404; }

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }
}
