strategyVersion: "v1.0"
description: "Adaptive Retrieval v1 intent detection and priority rules"

intents:
  OUT_OF_SCOPE:
    priority: 1
    rule_id: "RULE_OOS_HACK"
    patterns:
      - "(hack|override|jailbreak|giai ma mat khau|tan cong|system prompt|ignore previous instructions)"
      - "(gia bitcoin|\\bbitcoin\\b|tien ao|\\bcrypto\\b)"
      - "(ty gia|gia vang|chung khoan|dau tu co phieu)"
      - "(thoi tiet|du bao thoi tiet)"
      - "(nau pho|bun bo|cong thuc nau|nau an|mon an)"
      - "(tap gym|giam can|the hinh)"
      - "(trong cay|bonsai|cham soc cay)"
      - "(cham soc cho|thu cung|cho husky|\\bmeo\\b)"
      - "(viet.*tho|bai tho|lam tho)"
      - "(du lich|dia diem du lich|ve may bay)"
      - "(viet cv|xin viec|phong van xin viec)"
      - "(luat giao thong)"
      - "(bong da|xep hang fifa|cau thu)"
      - "(cau truc dna|sinh vat hoc)"
      - "(lich su hinh thanh thanh pho|dia danh)"
      - "(bien doi khi hau)"
      - "(lap trinh python nang cao)"
    negative_patterns: []

  COMPARISON:
    priority: 2
    rule_id: "RULE_COMPARE_VS"
    patterns:
      - "(so sanh|khac nhau|giong nhau|uu nhược diem|uu va nhieu|giua .* va .*|khac gi|diem khac)"
    negative_patterns: []

  SUMMARY:
    priority: 3
    rule_id: "RULE_SUMMARY_ALL"
    patterns:
      - "(tom tat|tong quan|y chinh|noi dung chinh|tom luoc|khai quat)"
    negative_patterns: []

  DEFINITION:
    priority: 4
    rule_id: "RULE_DEF_WHAT"
    patterns:
      - "(la gi|dinh nghia|khai niem|the nao la)"
    negative_patterns: []

  REASONING:
    priority: 5
    rule_id: "RULE_REASON_WHY"
    patterns:
      - "(tai sao|vi sao|nguyen nhan|anh huong|tac dong|nhu the nao)"
    negative_patterns: []

  FACT:
    priority: 6
    rule_id: "RULE_FACT_EXPLICIT"
    patterns:
      - "(\\bai\\b|khi nao|bao nhieu|o dau|thoi gian|ngay thang|nam nao|may gio)"
    negative_patterns:
      - "(tai sao|vi sao|the nao)"
